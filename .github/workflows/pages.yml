name: Deploy StrettoCharts dashboard

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'dashboard.html'
      - 'search-enhancements.js'
      - 'spotify-tracking.js'
      - 'scripts/test-browser.mjs'
      - 'artwork-provider.js'
      - 'scripts/check.mjs'
      - 'scripts/update-spotify-artists.mjs'
      - 'package.json'
      - 'data/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install test dependencies
        run: npm install --no-audit --no-fund
      - name: Refresh Spotify data
        run: node scripts/update-spotify-artists.mjs
      - name: Validate site
        run: npm run check
      - name: Parse JavaScript
        run: node --check search-enhancements.js && node --check spotify-tracking.js && node --check scripts/update-spotify-artists.mjs
      - name: Setup Pages
        uses: actions/configure-pages@v6
      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser smoke test
        run: node scripts/test-browser.mjs "${{ steps.deployment.outputs.page_url }}"
