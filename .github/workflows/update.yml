name: Update music charts

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/update.mjs'
      - '.github/workflows/update.yml'
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: strettocharts-pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Update charts
        run: npm run update

      - name: Commit changed chart data
        id: commit
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/latest.json data/history
          if git diff --cached --quiet; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            echo 'No chart data changes.'
            exit 0
          fi
          git commit -m 'Update music charts'
          git push
          echo 'changed=true' >> "$GITHUB_OUTPUT"

      - name: Build updated Svelte dashboard
        if: steps.commit.outputs.changed == 'true'
        run: npm run build

      - name: Setup Pages
        if: steps.commit.outputs.changed == 'true'
        uses: actions/configure-pages@v6

      - name: Upload updated Pages artifact
        if: steps.commit.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          path: './dist'

      - name: Deploy updated dashboard
        if: steps.commit.outputs.changed == 'true'
        id: deployment
        uses: actions/deploy-pages@v5
