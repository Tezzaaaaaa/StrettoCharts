name: Update music charts

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/update.mjs'
      - 'scripts/check.mjs'
      - 'package.json'
      - '.github/workflows/update.yml'
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: write

concurrency:
  group: strettocharts-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Validate repository
        run: npm run check

      - name: Update charts
        run: npm run update

      - name: Preserve existing daily history
        shell: bash
        run: |
          date=$(date -u +%F)
          if git cat-file -e "HEAD:data/history/${date}.json" 2>/dev/null; then
            git checkout HEAD -- "data/history/${date}.json"
          fi

      - name: Validate updated chart data
        run: npm run check

      - name: Commit changed chart data
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/latest.json data/history
          if git diff --cached --quiet; then
            echo 'No chart data changes.'
            exit 0
          fi
          git commit -m 'Update music charts'
          git push
