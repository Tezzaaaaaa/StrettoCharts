name: Validate StrettoCharts

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, chore/audit-cleanup]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Validate data and site
        run: npm run check
      - name: Test search race
        run: npm run test:search-race
